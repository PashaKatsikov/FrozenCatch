name: frozencatch
description: "Frozen Catch — ice fishing adventure on the northern lakes."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game (white part) state
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3

  # Gray part — networking, storage, attribution, push
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.1
  connectivity_plus: ^6.1.5
  appsflyer_sdk: ^6.17.2
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.1
  firebase_app_check: ^0.4.4
  flutter_local_notifications: ^19.4.2
  flutter_secure_storage: ^10.2.0
  device_info_plus: ^11.3.3
  http: ^1.5.0
  url_launcher: ^6.3.1
  clarity_flutter: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Frozen_Catch_gameplay_assets/
    - assets/Frozen_Catch_additional_assets/

flutter_launcher_icons:
  android: true
  ios: false
  # icon2_v4.png is the "zoomed-out" variant of the original artwork: the
  # metal bucket with three fish sits inside the central 55% of the canvas,
  # and the vibrant blue starburst background continues all the way to
  # every edge with no transparency. This means every Android launcher
  # mask (circle, rounded square, squircle, tear-drop, plain square)
  # crops only the outer background — never the bucket itself.
  image_path: "assets/Frozen_Catch_additional_assets/icon2_v3.png"
  adaptive_icon_background: "assets/Frozen_Catch_additional_assets/icon2_v3.png"
  adaptive_icon_foreground: "assets/Frozen_Catch_additional_assets/icon2_v3.png"
  # 9 dp inset on the foreground so the full bucket + fish heads sit safely
  # within the circular safe-zone (Android clips adaptive icons to ~74-80 dp
  # of the 108 dp canvas; fish heads in the source image reach ~5% from the
  # top, which without inset lands them inside the clipped zone).
  # The background layer (same image, 0% inset) fills the corners with the
  # blue starburst — no solid-colour bleed visible on square launchers.
  adaptive_icon_foreground_inset: 9
  min_sdk_android: 30
