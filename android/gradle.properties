org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler tries to compute paths relative to the
# project dir, which throws on Windows when the project and the Gradle/Pub
# caches live on different drive letters. Disabling it avoids that crash.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
